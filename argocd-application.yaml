apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-exchange-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/RAM55O/book-exchange-platform.git"
    targetRevision: main
    path: book-exchange # Use 'book-exchange' if Chart.yaml is in the folder, or '.' if in root
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: n-book-exchange
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true