name: CI/CD & DevSecOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'book-exchange/values.yaml'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # MUST be lowercase:
  IMAGE_NAME: ram55o/book-exchange

jobs:
  build-scan-push:
    name: Build, Scan & Publish
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Git SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image Locally for Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Container Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  update-helm-gitops:
    name: Update Helm Values & Trigger Argo CD
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image Tag in Helm Chart
        run: |
          NEW_TAG="${{ needs.build-scan-push.outputs.short_sha }}"
          sed -i "s/tag:.*/tag: \"$NEW_TAG\"/g" book-exchange/values.yaml

      - name: Commit and Push Updated values.yaml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add book-exchange/values.yaml
          git diff-index --quiet HEAD || git commit -m "ci(gitops): bump image tag to ${{ needs.build-scan-push.outputs.short_sha }} [skip ci]"
          git push origin main