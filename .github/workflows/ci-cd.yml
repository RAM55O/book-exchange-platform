name: CI/CD & DevSecOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'book-exchange/values.yaml'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'book-exchange/values.yaml'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  # Must be strictly lowercase to satisfy Docker/GHCR rules
  IMAGE_NAME: ram55o/book-exchange
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./terraform

jobs:
  # ============================================================================
  # JOB 1: DOCKER BUILD, TRIVY CONTAINER SCAN & PUBLISH TO GHCR
  # ============================================================================
  build-scan-push:
    name: Build, Scan & Publish Docker Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Git SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image Locally for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- TRIVY VULNERABILITY SCAN ---
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          format: 'table'
          exit-code: '0' # Reports findings without failing the build
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Container Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ============================================================================
  # JOB 2: TERRAFORM IAC - PROVISION AWS INFRASTRUCTURE & LAUNCH LIVE APP
  # ============================================================================
  terraform:
    name: Terraform IaC (Provision AWS & Live App)
    needs: build-scan-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Scan Terraform Code with Trivy (IaC Security)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: ./terraform
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Terraform Plan
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: terraform plan -no-color
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply (Auto-Provision AWS Infrastructure)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: terraform apply -auto-approve -no-color
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ============================================================================
  # JOB 3: GITOPS HELM UPDATE (AUTOMATIC ARGO CD SYNC)
  # ============================================================================
  update-helm-gitops:
    name: Update Helm Values & Trigger Argo CD
    needs: [build-scan-push, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image Tag in Helm values.yaml
        run: |
          NEW_TAG="${{ needs.build-scan-push.outputs.short_sha }}"
          sed -i "s/tag:.*/tag: \"$NEW_TAG\"/g" book-exchange/values.yaml

      - name: Commit and Push Updated values.yaml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add book-exchange/values.yaml
          git diff-index --quiet HEAD || git commit -m "ci(gitops): bump image tag to ${{ needs.build-scan-push.outputs.short_sha }} [skip ci]"
          git push origin main
